name: Safe Chain

on:
  pull_request:
  push:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safe-chain:
    name: Malware Scan (install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install safe-chain
        env:
          # Pinned SHA-256 of the 1.5.12 install script. Bump this when the version above changes.
          SAFE_CHAIN_SHA256: e40995d546160bf18788dbfc6e9a4a765152abeca92014adf85102cf6b13d890
        run: |
          curl -fsSL https://github.com/AikidoSec/safe-chain/releases/download/1.5.12/install-safe-chain.sh -o install-safe-chain.sh
          echo "${SAFE_CHAIN_SHA256}  install-safe-chain.sh" | sha256sum -c -
          sh install-safe-chain.sh --ci
          rm -f install-safe-chain.sh

      - name: Install dependencies (scanned by safe-chain)
        run: bun install --frozen-lockfile
